<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>(　´ᯅ`　) </title>
<style>
:root {
  --bg: #070720;         
  --neon-pink: #ff7ad9; 
  --neon-cyan: #4de1ff;   
  --neon-yellow: #ffe84a; 
  --neon-purple: #b68cff; 
  --panel: rgba(8, 6, 32, 0.75); 
}

body {
  background-color: var(--bg);
  color: #fff;
  font-family: "MS Gothic", monospace;
  margin: 0;
  text-align: center;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch; 
}

#mycelium {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(circle at 30% 40%, rgba(255,122,217,0.28) 0%, transparent 55%),
    radial-gradient(circle at 70% 60%, rgba(77,225,255,0.25) 0%, transparent 55%);
  animation: spores 5s infinite ease-in-out alternate;
}

@keyframes spores {
  from { transform: scale(1); opacity: 0.3; filter: blur(2px); }
  to { transform: scale(1.25); opacity: 0.8; filter: blur(4px); }
}

#spores {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: -1;
  pointer-events: none;
}

.container {
  position: relative;
  z-index: 2;
  max-width: 800px;
  margin: 60px auto 80px; 
  background: var(--panel);
  border-radius: 20px;
  padding: 40px;
  border: 2px solid var(--neon-cyan);
  box-shadow:
    0 0 12px rgba(77,225,255,0.7),
    0 0 40px rgba(255,122,217,0.4),
    inset 0 0 25px rgba(182,140,255,0.18);
  backdrop-filter: blur(8px);
  animation: fadeIn 2s ease;
  box-sizing: border-box;
  width: calc(100% - 32px);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  font-size: 2em;
  margin-bottom: 0.3em;
  color: #fff;
  text-shadow:
    0 0 6px #fff,
    0 0 14px var(--neon-pink),
    0 0 30px var(--neon-pink),
    0 0 50px var(--neon-cyan);
}

h2 {
  font-size: 1.2em;
  color: var(--neon-yellow);
  text-shadow: 0 0 8px var(--neon-yellow);
  margin-top: 0;
  font-weight: normal;
}

p {
  line-height: 1.8;
  font-size: 1em;
  color: #fff;
  margin: 20px auto;
  width: 90%;
}

hr {
  border: none;
  height: 2px;
  width: 80%;
  margin: 30px auto;
  background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-yellow), var(--neon-cyan), var(--neon-pink));
  box-shadow: 0 0 8px rgba(255,122,217,0.8);
}

.button {
  display: inline-block;
  margin-top: 20px;
  color: #1a0033;
  text-decoration: none;
  font-size: 1em;
  padding: 10px 25px;
  border-radius: 12px;
  background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple), var(--neon-cyan));
  border: 2px solid #fff;
  box-shadow:
    0 0 10px rgba(255,122,217,0.8),
    0 0 24px rgba(77,225,255,0.5);
  transition: transform 0.2s ease, box-shadow 0.3s ease;
  font-weight: bold;
}

.button:hover {
  transform: scale(1.05);
  box-shadow:
    0 0 16px rgba(255,122,217,1),
    0 0 40px rgba(77,225,255,0.9);
}

#growMsg {
  position: fixed;
  bottom: 10px; width: 100%;
  text-align: center; opacity: 0;
  transition: opacity 1s ease;
  font-size: 0.9em; 
  color: var(--neon-cyan);
  text-shadow: 0 0 8px var(--neon-cyan);
}

.shard {
  position: fixed;
  width: 0;
  height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 20px solid var(--neon-purple);
  pointer-events: none;
  z-index: 9999;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.9));
}
</style>
</head>
<body>
<canvas id="spores"></canvas>
<div id="mycelium"></div>

<div class="container">
  <h1>(　´ᯅ`　)</h1>

<p>
  ようこそ、きのこの庭へ。<br>
  役に立つものは、たぶんありません。<br>
  思いついたものを、思いついた順に<br>
  置いているだけの場所です。<br>
  意味はないけど、悪気もありません。<br>
  気に入ったページがあったら、<br>
  こっそり楽しんでいってください。<br>
  たまに新しいのが生えます🍄
</p>

  <a href="index.html" class="button">🍄 帰る</a><br>
  <a href="profile.html" class="button">(　´ᯅ`　)</a>
</div>

<script>
const NEON_COLORS = ['#ff7ad9', '#4de1ff', '#ffe84a', '#b68cff'];

const canvas = document.getElementById("spores");
const ctx = canvas.getContext("2d");
let w, h, spores = [];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  spores = Array.from({length: 150}, () => ({
    x: Math.random() * w, y: Math.random() * h,
    r: Math.random() * 2, o: Math.random(),
    s: Math.random() * 0.5 + 0.2, z: Math.random() * 2
  }));
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  spores.forEach(s => {
    s.x += Math.sin(Date.now() * 0.0001 + s.y) * 0.1 * s.z;
    s.y += Math.cos(Date.now() * 0.00005 + s.x) * 0.1 * s.z;
    if (s.x < 0) s.x = w; if (s.x > w) s.x = 0;
    if (s.y < 0) s.y = h; if (s.y > h) s.y = 0;
    s.o += (Math.random() - 0.5) * 0.05;
    s.o = Math.max(0.1, Math.min(1, s.o));

    // 横位置でネオンの色を決める
    const idx = Math.min(NEON_COLORS.length - 1, Math.floor((s.x / w) * NEON_COLORS.length));
    const alpha = Math.floor(s.o * 255).toString(16).padStart(2, '0');

    ctx.beginPath();
    ctx.fillStyle = `${NEON_COLORS[idx]}${alpha}`;
    ctx.arc(s.x, s.y, s.r * s.z, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);
resize(); draw();

document.addEventListener("mousemove", (e) => {
  const x = (e.clientX / window.innerWidth - 0.5) * 2;
  const y = (e.clientY / window.innerHeight - 0.5) * 2;
  canvas.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
});


let idleTimer;
const growMsg = document.getElementById("growMsg");
function showGrowMsg() { if (growMsg) growMsg.style.opacity = 1; }
function resetIdleTimer() {
  if (growMsg) growMsg.style.opacity = 0;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(showGrowMsg, 30000);
}
window.onload = resetIdleTimer;
document.onmousemove = resetIdleTimer;
document.onkeydown = resetIdleTimer;

document.addEventListener('click', (e) => {
  const shardCount = 12;

  for (let i = 0; i < shardCount; i++) {
    const shard = document.createElement('div');
    shard.className = 'shard';
    
    const color = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
    const size = Math.random() * 15 + 5;
    shard.style.borderBottom = `${size * 2}px solid ${color}`;
    shard.style.borderLeftWidth = `${size}px`;
    shard.style.borderRightWidth = `${size}px`;
    shard.style.left = e.clientX + 'px';
    shard.style.top = e.clientY + 'px';

    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 150 + 50;
    const tx = Math.cos(angle) * velocity;
    const ty = Math.sin(angle) * velocity;
    const rot = Math.random() * 360;

    document.body.appendChild(shard);

    const anim = shard.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(0)`, opacity: 0 }
    ], {
      duration: Math.random() * 500 + 500,
      easing: 'cubic-bezier(0, .9, .57, 1)'
    });

    anim.onfinish = () => shard.remove();
  }
});
</script>
</body>
</html>
