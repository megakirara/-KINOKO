<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070720">
<title>🪐( ´ᯅ` )🌎</title>

<style>
:root {
  --bg: #070720;
  --pink: #ff7ad9;
  --cyan: #4de1ff;
  --yellow: #ffe84a;
  --purple: #b68cff;
  --unicorn-gradient: linear-gradient(135deg, #ff7ad9, #4de1ff, #b68cff, #ffe84a, #ff7ad9);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: #f8edff;
  background-color: var(--bg);
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  text-align: center;
  user-select: none;
  -webkit-overflow-scrolling: touch;
  -webkit-tap-highlight-color: transparent;
}

a, button, .cloud {
  outline: none;
}

#background-image {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(7, 7, 32, 0.40), rgba(7, 7, 32, 0.55)),
    url("files/neon_back.jpg");
  background-repeat: no-repeat, repeat;
  background-attachment: fixed, fixed;
  background-position: center, center;
  background-size: auto, 888px auto;
}

#mycelium,
#spore-canvas,
#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#mycelium {
  z-index: 0;
  opacity: 0.3;
  background:
    radial-gradient(ellipse at 15% 25%, #642cff33, transparent 45%),
    radial-gradient(ellipse at 85% 65%, #ff36bd22, transparent 45%),
    radial-gradient(ellipse at 50% 90%, #00eaff1a, transparent 40%);
  animation: myceliumGlow 9s ease-in-out infinite alternate;
}

#spore-canvas {
  z-index: 1;
}

#stars {
  z-index: 1;
}

@keyframes myceliumGlow {
  from { opacity: 0.18; }
  to { opacity: 0.48; }
}

#parallax-bg {
  position: fixed;
  top: -10%;
  left: -10%;
  width: 120%;
  height: 120%;
  z-index: 0;
  pointer-events: none;
  will-change: transform;
}

.brain-particle {
  position: absolute;
  font-size: calc(2rem + 2vw);
  opacity: 0.15;
  animation: floatParticle var(--dur, 8s) ease-in-out infinite alternate;
  animation-delay: var(--delay, 0s);
  will-change: transform, opacity;
}

@keyframes floatParticle {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0.08; }
  100% { transform: translateY(-30px) rotate(15deg); opacity: 0.28; }
}

#touch-spotlight {
  position: fixed;
  z-index: 1;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -50%);
  background: radial-gradient(
    circle,
    rgba(255, 122, 217, 0.4) 0%,
    rgba(77, 225, 255, 0.18) 40%,
    transparent 70%
  );
  transition: opacity 0.15s ease-out;
}

#touch-spotlight.active {
  opacity: 1;
}

.profile-card {
  position: relative;
  z-index: 10;
  width: min(420px, calc(100% - 32px));
  margin: 5vh auto 20px;
  padding: 36px 24px 38px;
  border: 2px solid #ff7ad9;
  border-radius: 24px;
  background: rgba(8, 6, 32, 0.25);
  box-shadow:
    0 0 15px #ff7ad988,
    0 0 35px #ff3dc844,
    inset 0 0 25px #b68cff33;
  backdrop-filter: blur(3px);
  text-align: center;
  animation: fadeIn 1.6s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.profile-card h1 {
  margin: 0 0 10px;
  color: #ffe3f7;
  font-size: clamp(1.7rem, 7vw, 2.4rem);
  line-height: 1.4;
  text-shadow:
    0 0 4px #fff,
    0 0 10px #ff7ad9,
    0 0 22px #ff3dc8,
    0 0 44px #ff3dc8,
    0 0 80px #ff3dc888,
    0 0 6px #4de1ff66;
  animation: neonFlicker 4.5s linear infinite;
}

@keyframes neonFlicker {
  0%, 17%, 21%, 24%, 52%, 56%, 80%, 83%, 100% {
    opacity: 1;
    color: #ffe3f7;
    text-shadow:
      0 0 4px #fff,
      0 0 10px #ff7ad9,
      0 0 22px #ff3dc8,
      0 0 44px #ff3dc8,
      0 0 80px #ff3dc888,
      0 0 6px #4de1ff66;
  }

  18%, 22%, 54%, 81% {
    opacity: 0.55;
    color: #c98ab5;
    text-shadow:
      0 0 2px #ff7ad966,
      0 0 6px #ff7ad944;
  }

  19%, 23%, 55%, 82% {
    opacity: 0.9;
    color: #ffd0f0;
    text-shadow:
      0 0 3px #fff,
      0 0 8px #ff7ad9,
      0 0 16px #ff3dc8;
  }
}

.home-link {
  display: inline-block;
  color: inherit;
  text-decoration: none;
  transition: transform 0.2s;
}

.home-link:hover {
  transform: scale(1.06);
}

.profile-card p {
  margin: 10px 0;
  color: #f0eaff;
  font-weight: 600;
  font-size: 1.05rem;
  line-height: 1.7;
}

.profile-label {
  margin-right: 8px;
  color: var(--pink);
  font-weight: 900;
  text-shadow: 0 0 8px var(--pink);
}

#days-until-birthday {
  font-weight: 700;
  font-size: 1rem;
  background: linear-gradient(90deg, #ff7ad9, #4de1ff, #b68cff, #ffe84a, #ff7ad9);
  background-size: 400% 400%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbowShift 5s linear infinite;
}

@keyframes rainbowShift {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.cloud {
  display: block;
  width: 200px;
  height: 75px;
  margin: 0 auto 16px;
  background: var(--unicorn-gradient);
  background-size: 200% 200%;
  border-radius: 50% / 100%;
  filter: drop-shadow(0 0 12px rgba(255, 122, 217, 0.9));
  box-shadow: 20px 10px 15px rgba(77, 225, 255, 0.3);
  cursor: pointer;
  z-index: 20;
  animation:
    floatCloud 5s ease-in-out infinite,
    rainbowShift 10s linear infinite;
  transition: transform 0.1s ease;
}

.cloud:active {
  transform: scale(0.95);
}

@keyframes floatCloud {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

#summon-log {
  position: fixed;
  top: 15vh;
  right: 20px;
  z-index: 15;
  width: 360px;
  max-height: 65vh;
  padding: 15px 20px;
  overflow-y: auto;
  border: 1px solid #b6ff5c;
  border-radius: 16px;
  background: #080820a8;
  box-shadow: 0 0 10px #b6ff5c48;
  backdrop-filter: blur(8px);
  color: #e3dafa;
  font-size: 0.9rem;
  line-height: 1.7;
  text-align: left;
}

#summon-log strong {
  color: var(--yellow);
  text-shadow: 0 0 8px #ffe84a88;
}

#summon-log div {
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px dashed #b68cff55;
}

.floating-emoji {
  position: fixed;
  z-index: 100;
  font-size: 8rem;
  pointer-events: none;
  animation: floatUp 1s forwards ease-out;
}

.glow {
  text-shadow:
    0 0 10px #fff,
    0 0 20px var(--pink),
    0 0 40px var(--cyan);
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-120px) scale(2.5); }
}

@media (max-width: 700px) {
  .profile-card {
    margin: 16px auto;
    padding: 26px 16px 28px;
  }

  .profile-card p {
    margin: 6px 0;
    font-size: 0.95rem;
  }

  .cloud {
    width: 160px;
    height: 60px;
  }

  #summon-log {
    position: relative;
    top: auto;
    right: auto;
    z-index: 10;
    width: min(420px, calc(100% - 32px));
    max-height: 200px;
    margin: 0 auto 60px;
  }

  #touch-spotlight {
    width: 420px;
    height: 420px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>
<div id="background-image" aria-hidden="true"></div>
<div id="mycelium" aria-hidden="true"></div>
<div id="parallax-bg" aria-hidden="true"></div>
<div id="touch-spotlight" aria-hidden="true"></div>
<div id="stars" aria-hidden="true"></div>
<canvas id="spore-canvas" aria-hidden="true"></canvas>

<div class="profile-card">
  <div class="cloud"></div>
  <a href="index.html" class="home-link"><h1>🪐( ´ᯅ` )🌎</h1></a>
  <p><span class="profile-label">名前：</span>にーとの輝星（まゆげちゃん）</p>
  <p><span class="profile-label">出自：</span>🪐✖️🌎</p>
  <p><span class="profile-label">誕生日：</span>6月15日</p>
  <p><span class="profile-label">年齢：</span><span id="age-value">計算中...</span></p>
  <p><span class="profile-label">生年：</span>紀元前249997975年</p>
  <p><span class="profile-label">誕生日まで：</span><br><span id="days-until-birthday">計算中...</span></p>
</div>

<div id="summon-log"><strong>めじ❗️ログ</strong><br></div>

<script>
"use strict";

const reduceMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

(() => {
  const canvas = document.getElementById("spore-canvas");
  const ctx = canvas.getContext("2d");

  if (!ctx) return;

  let width = 0;
  let height = 0;
  let spores = [];
  let mouseX = 0;
  let mouseY = 0;

  const colors = [
    "#ff7ad9",
    "#4de1ff",
    "#ffe84a",
    "#b68cff",
    "#b6ff5c"
  ];

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    const count = Math.min(
      180,
      Math.max(60, Math.floor((width * height) / 8500))
    );

    spores = Array.from({ length: count }, () => createSpore(true));

    if (reduceMotion) drawStatic();
  }

  function createSpore(randomY = false) {
    return {
      x: Math.random() * width,
      y: randomY ? Math.random() * height : height + 10,
      size: Math.random() * 2.1 + 0.5,
      speed: Math.random() * 0.55 + 0.12,
      drift: (Math.random() - 0.5) * 0.45,
      alpha: Math.random() * 0.65 + 0.2,
      color: colors[Math.floor(Math.random() * colors.length)],
      phase: Math.random() * Math.PI * 2
    };
  }

  function drawStatic() {
    ctx.clearRect(0, 0, width, height);

    for (const spore of spores) {
      ctx.globalAlpha = spore.alpha;
      ctx.fillStyle = spore.color;
      ctx.beginPath();
      ctx.arc(spore.x, spore.y, spore.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);

    for (const spore of spores) {
      spore.phase += 0.015;
      spore.x += spore.drift + Math.sin(spore.phase) * 0.12;
      spore.y -= spore.speed;

      if (spore.y < -10) {
        Object.assign(spore, createSpore(false));
      }

      if (spore.x < -10) spore.x = width + 10;
      if (spore.x > width + 10) spore.x = -10;

      const parallaxX = mouseX * 0.012;
      const parallaxY = mouseY * 0.012;

      ctx.globalAlpha = spore.alpha;
      ctx.fillStyle = spore.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = spore.color;

      ctx.beginPath();
      ctx.arc(
        spore.x + parallaxX,
        spore.y + parallaxY,
        spore.size,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
  }

  window.addEventListener("resize", resize, { passive: true });

  window.addEventListener("mousemove", (event) => {
    mouseX = event.clientX - width / 2;
    mouseY = event.clientY - height / 2;
  }, { passive: true });

  resize();

  if (!reduceMotion) {
    animate();
  }
})();

(() => {
  const container = document.getElementById("stars");
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < 50; i++) {
    const star = document.createElement("span");

    star.textContent = "✦";
    star.setAttribute("aria-hidden", "true");

    Object.assign(star.style, {
      position: "absolute",
      left: Math.random() * 100 + "%",
      top: Math.random() * 100 + "%",
      color: i % 2 ? "#4de1ff" : "#ff7ad9",
      fontSize: Math.random() * 9 + 5 + "px",
      opacity: String(Math.random() * 0.55 + 0.12),
      textShadow: "0 0 8px currentColor",
      animation: `starBlink ${Math.random() * 3 + 2}s ease-in-out infinite alternate`,
      animationDelay: Math.random() * -5 + "s"
    });

    fragment.appendChild(star);
  }

  const style = document.createElement("style");
  style.textContent = `
    @keyframes starBlink {
      from { opacity: 0.12; }
      to { opacity: 0.85; }
    }
  `;

  document.head.appendChild(style);
  container.appendChild(fragment);
})();

document.addEventListener("click", (event) => {
  if (reduceMotion) return;

  const colors = ["#ff7ad9", "#4de1ff", "#ffe84a", "#b68cff"];

  for (let i = 0; i < 6; i++) {
    const spark = document.createElement("span");
    const angle = Math.PI * 2 * i / 6;
    const distance = 18 + Math.random() * 24;

    spark.textContent = "✦";

    Object.assign(spark.style, {
      position: "fixed",
      left: event.clientX + "px",
      top: event.clientY + "px",
      zIndex: "99",
      pointerEvents: "none",
      color: colors[i % colors.length],
      fontSize: "13px",
      textShadow: "0 0 8px currentColor",
      transition: "transform 550ms ease-out, opacity 550ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      spark.style.transform =
        `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 650);
  }
});

(() => {
  if (reduceMotion) return;

  const targets = document.querySelectorAll("h1, .cloud");
  const colors = ["#ff65c3", "#b6ff5c", "#62f7ff", "#b68cff", "#ffb85c", "#ffe84a"];
  const marks = ["✦", "✧", "✨"];

  function sparkle(element) {
    const rect = element.getBoundingClientRect();
    const spark = document.createElement("span");

    spark.textContent = marks[Math.floor(Math.random() * marks.length)];

    Object.assign(spark.style, {
      position: "absolute",
      left: rect.left + Math.random() * rect.width + "px",
      top: rect.top + Math.random() * rect.height + "px",
      zIndex: "99",
      pointerEvents: "none",
      color: colors[Math.floor(Math.random() * colors.length)],
      fontSize: 9 + Math.random() * 10 + "px",
      textShadow: "0 0 8px currentColor",
      opacity: "1",
      transition: "transform 750ms ease-out, opacity 750ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      const dx = (Math.random() - 0.5) * 44;
      const dy = -(18 + Math.random() * 32);
      const rot = (Math.random() - 0.5) * 180;
      spark.style.transform =
        `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.4)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 800);
  }

  targets.forEach((element) => {
    let timer = null;

    element.addEventListener("mouseenter", () => {
      if (timer) return;
      sparkle(element);
      timer = window.setInterval(() => sparkle(element), 90);
    });

    element.addEventListener("mouseleave", () => {
      window.clearInterval(timer);
      timer = null;
    });
  });
})();

(() => {
  const BG_EMOJIS = ["🪐", "💫", "🌎"];

  const parallaxBg = document.getElementById("parallax-bg");
  const spotlight = document.getElementById("touch-spotlight");
  const fragment = document.createDocumentFragment();

  const PARTICLE_COUNT = 60;
  const MIN_DIST = 8;
  const placed = [];

  function isFarEnough(x, y) {
    return placed.every((p) => Math.hypot(p.x - x, p.y - y) >= MIN_DIST);
  }

  let attempts = 0;
  let count = 0;

  while (count < PARTICLE_COUNT && attempts < PARTICLE_COUNT * 10) {
    attempts++;

    const x = Math.random() * 100;
    const y = Math.random() * 100;

    if (!isFarEnough(x, y)) continue;

    placed.push({ x, y });

    const p = document.createElement("div");
    p.className = "brain-particle";
    p.textContent = BG_EMOJIS[count % BG_EMOJIS.length];
    p.style.cssText =
      `left:${x}%;top:${y}%;--dur:${7 + Math.random() * 8}s;--delay:${Math.random() * 5}s`;

    fragment.appendChild(p);
    count++;
  }

  parallaxBg.appendChild(fragment);

  let targetX = 0;
  let targetY = 0;
  let currentX = 0;
  let currentY = 0;
  let rafId = null;

  function setParallaxTarget(clientX, clientY) {
    targetX = (window.innerWidth / 2 - clientX) / 30;
    targetY = (window.innerHeight / 2 - clientY) / 30;

    if (!rafId) rafId = requestAnimationFrame(animateParallax);
  }

  function animateParallax() {
    currentX += (targetX - currentX) * 0.1;
    currentY += (targetY - currentY) * 0.1;

    parallaxBg.style.transform = `translate(${currentX}px,${currentY}px)`;

    if (
      Math.abs(targetX - currentX) > 0.05 ||
      Math.abs(targetY - currentY) > 0.05
    ) {
      rafId = requestAnimationFrame(animateParallax);
    } else {
      rafId = null;
    }
  }

  document.addEventListener("mousemove", (e) => {
    setParallaxTarget(e.clientX, e.clientY);
  });

  let spotlightTimer = null;

  function showSpotlight(x, y) {
    clearTimeout(spotlightTimer);
    spotlight.style.left = x + "px";
    spotlight.style.top = y + "px";
    spotlight.classList.add("active");
  }

  document.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    setParallaxTarget(t.clientX, t.clientY);
    showSpotlight(t.clientX, t.clientY);
  }, { passive: true });

  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    setParallaxTarget(t.clientX, t.clientY);
    showSpotlight(t.clientX, t.clientY);
  }, { passive: true });

  document.addEventListener("touchend", () => {
    spotlightTimer = setTimeout(() => {
      spotlight.classList.remove("active");
    }, 400);
  });
})();

(() => {
  const summons = [
    { emoji: "🍺", poems: ["とりあえず飲めよ（ ´_ゝ`）。", "ほら、冷えてんだからさァ（ ´_ゝ`）", "冷凍庫に缶入れてんの忘れたら爆発したんだけど（ ；_ゝ； ）。"] },
    { emoji: "🥟", poems: ["しいたけ入れたらうまいよ。", "あ、自分ニラ入れないんすよね（ ´_ゝ`）。", "一食で何個食える（ ´_ゝ`）？"] },
    { emoji: "🍔", poems: ["挟まってる肉がなんの肉かなんて…どうでもいいよ（ ´_ゝ`）", "ビッ○○ックなら3個は食うよ（ ´_ゝ`）"] },
    { emoji: "🍟", poems: ["たまにやったら長い芋入ってんの何（ ´_ゝ`）", "自分で芋揚げたら同じ値段で何倍も量食えますからね。"] }
  ];

  const cloud = document.querySelector(".cloud");
  const summonLog = document.getElementById("summon-log");

  function addSummonLog(text) {
    const line = document.createElement("div");
    line.textContent = text;
    summonLog.appendChild(line);
    summonLog.scrollTop = summonLog.scrollHeight;
  }

  cloud.addEventListener("click", () => {
    if (Math.random() < 0.1) {
      addSummonLog("❌ 出ないこともあるんすよね（ ´_ゝ`）。");
      return;
    }

    const item = summons[Math.floor(Math.random() * summons.length)];
    const poem = item.poems[Math.floor(Math.random() * item.poems.length)];

    const float = document.createElement("div");
    float.textContent = item.emoji;
    float.className = "floating-emoji glow";
    float.style.left = `${Math.random() * 70 + 15}%`;
    float.style.top = `${Math.random() * 50 + 25}%`;
    document.body.appendChild(float);
    setTimeout(() => float.remove(), 1000);

    addSummonLog(`${item.emoji} ${poem}`);
  });
})();

function updateAge() {
  const now = new Date();
  const thisBday = new Date(now.getFullYear(), 5, 15);

  let age = now.getFullYear() + 249997976;
  if (now < thisBday) age -= 1;

  document.getElementById("age-value").textContent =
    age.toLocaleString() + "歳";

  if (now > thisBday) thisBday.setFullYear(now.getFullYear() + 1);

  const diff = thisBday - now;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById("days-until-birthday").textContent =
    `${d}日 ${h}時間 ${m}分 ${s}秒`;
}

setInterval(updateAge, 1000);
updateAge();
</script>
</body>
</html>
