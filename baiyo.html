<style>
body {
  background-color: #0b0015;
  color: #fff;

  overflow-x: hidden;
  overflow-y: auto;

#mycelium {
  position: fixed;

  filter: blur(2px);
}

  from { transform: scale(1); opacity: 0.4; }

}

#spores {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: -1;
  pointer-events: none;
  transition: transform 0.1s ease-out;
}

.main-container {
  position: relative;
  z-index: 2;

  background: rgba(10, 0, 20, 0.7);
  border-radius: 30px;
  padding: 40px 30px;
  box-shadow: 0 0 40px rgba(255, 182, 193, 0.35); 
  border: 2px solid rgba(255, 192, 203, 0.25);
  backdrop-filter: blur(10px);
}

h1 {
  margin-top: 10px;
  font-size: 2.2em;
  letter-spacing: 0.05em;
  text-shadow: 0 0 10px #ffc0ff, 0 0 20px #ffe0ff;

.tagline {

  color: #ffeaff;
}

.marquee {
  position: relative;

  white-space: nowrap;
  margin-bottom: 40px;
}
.marquee p {
  display: inline-block;
  animation: scrollText 25s linear infinite;
  color: #ffccff;
}
@keyframes scrollText {
  from { transform: translateX(100%); }
  to { transform: translateX(-100%); }
}

/* ★単品サイトを並べるグリッドレイアウト */
.site-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
  margin: 0 auto 40px;
}

/* ★個別のサイトカード */
.site-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 192, 203, 0.2);
  border-radius: 20px;
  padding: 25px 20px;
  transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.site-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(255, 192, 203, 0.2);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 192, 203, 0.4);
}

.site-card h3 {
  margin: 0 0 10px;
  font-size: 1.2em;
  color: #fff;
  text-shadow: 0 0 5px #ffc0ff;
}

.site-card p {
  font-size: 0.9em;
  color: #ddbbee;
  line-height: 1.5;
  margin-bottom: 20px;
  flex-grow: 1;
}

button {
  background: linear-gradient(45deg, #ffd6ff, #eaffff, #fff2e0, #ffe1ff);
  color: #2a0033;
  border: none;
  padding: 12px 30px;
  font-size: 1em;
  font-family: "MS Gothic", monospace;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255,200,255,0.3);
  transition: transform 0.2s ease, box-shadow 0.3s ease;
  font-weight: bold;
  width: 100%;
}
button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(255,255,255,0.6);
}

/* 戻るボタン用スタイル */
.back-link {
  display: inline-block;
  color: #ffccff;
  text-decoration: none;
  margin-top: 20px;
  font-size: 0.9em;
  transition: 0.3s;

}
.back-link:hover {
  color: #ffffff;
  text-shadow: 0 0 8px #ffe6ff;
  border-bottom: 1px dashed #ffffff;

/* その他の既存スタイル */
.shard {
  position: fixed; width: 0; height: 0;
  border-left: 10px solid transparent; border-right: 10px solid transparent;
  border-bottom: 20px solid #c1a3e4; pointer-events: none; z-index: 9999;
  filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
}
@keyframes twinkle { 0%,100% {opacity: 0.4;} 50% {opacity: 1;} }
.star {
  position: absolute; background: white; border-radius: 50%;
  animation: twinkle 3s infinite ease-in-out;
}
</style>
</head>
<body>

<script>
/* 胞子＆星屑アニメーション（既存のまま） */
const canvas = document.getElementById("spores");
const ctx = canvas.getContext("2d");
let w, h, spores = [];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  spores = Array.from({length: 250}, () => ({
    x: Math.random() * w, y: Math.random() * h,
    r: Math.random() * 2 + 1, o: Math.random(),
    s: Math.random() * 0.5 + 0.2, z: Math.random() * 2
  }));
}
function draw() {
  ctx.clearRect(0, 0, w, h);
  spores.forEach(s => {
    s.x += Math.sin(Date.now() * 0.0001 + s.y) * 0.2 * s.z;
    s.y += Math.cos(Date.now() * 0.00005 + s.x) * 0.2 * s.z;
    if (s.x < 0) s.x = w; if (s.x > w) s.x = 0;
    if (s.y < 0) s.y = h; if (s.y > h) s.y = 0;
    s.o += (Math.random() - 0.5) * 0.05;
    s.o = Math.max(0.1, Math.min(1, s.o));
    const hue = (s.x / w) * 360;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${hue}, 80%, 80%, ${s.o})`;
    ctx.arc(s.x, s.y, s.r * s.z, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
window.addEventListener("resize", resize);
resize(); draw();

/* マウス追従 */
document.addEventListener("mousemove", (e) => {
  const x = (e.clientX / window.innerWidth - 0.5) * 2;
  const y = (e.clientY / window.innerHeight - 0.5) * 2;
  canvas.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
});

/* 星屑生成 */
for (let i = 0; i < 50; i++) {
  const star = document.createElement("div");
  star.classList.add("star");
  star.style.width = star.style.height = Math.random() * 3 + "px";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDuration = 2 + Math.random() * 3 + "s";
  document.body.appendChild(star);
}

/* 三角形爆発エフェクト */
document.addEventListener('click', (e) => {
  const shardCount = 12;
  const colors = ['#f9c5d1', '#a6d0e4', '#c1a3e4', '#fbe88b', '#a8f0c6'];

  for (let i = 0; i < shardCount; i++) {
    const shard = document.createElement('div');
    shard.className = 'shard';
    
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = Math.random() * 15 + 5;
    shard.style.borderBottom = `${size * 2}px solid ${color}`;
    shard.style.borderLeftWidth = `${size}px`;
    shard.style.borderRightWidth = `${size}px`;
    shard.style.left = e.clientX + 'px';
    shard.style.top = e.clientY + 'px';

    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 150 + 50;
    const tx = Math.cos(angle) * velocity;
    const ty = Math.sin(angle) * velocity;
    const rot = Math.random() * 360;

    document.body.appendChild(shard);

    const anim = shard.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(0)`, opacity: 0 }
    ], {
      duration: Math.random() * 500 + 500,
      easing: 'cubic-bezier(0, .9, .57, 1)'
    });

    anim.onfinish = () => shard.remove();
  }
});
</script>
