<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070720">
  <title>⭐️ヽ( ´ᯅ` )ノ💫</title>

  <style>
    :root {
      --bg: #070720;
      --neon-pink: #ff7ad9;
      --neon-cyan: #4de1ff;
      --neon-yellow: #ffe84a;
      --neon-purple: #b68cff;
      --panel: rgba(8, 6, 32, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      margin: 0;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }

    #background-image {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(7, 7, 32, 0.30), rgba(7, 7, 32, 0.40)),
        url("files/neon_back.jpg");
      background-repeat: no-repeat, repeat;
      background-attachment: fixed, fixed;
      background-position: center, center;
      background-size: auto, 555px auto;
    }

    #background-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }

    #mycelium {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(
          circle at 30% 40%,
          rgba(255, 122, 217, 0.28) 0%,
          transparent 55%
        ),
        radial-gradient(
          circle at 70% 60%,
          rgba(77, 225, 255, 0.25) 0%,
          transparent 55%
        );
      animation: breathe 5s infinite ease-in-out alternate;
    }

    @keyframes breathe {
      from { opacity: 0.3; }
      to { opacity: 0.8; }
    }

    #spores {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .outer-container {
      position: relative;
      z-index: 2;
      max-width: 650px;
      margin: 60px auto 80px;
      background: var(--panel);
      border-radius: 24px;
      padding: 40px 24px;
      border: 2px solid var(--neon-pink);
      box-shadow:
        0 0 15px #ff7ad988,
        0 0 35px #ff3dc844,
        inset 0 0 25px #b68cff33;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      width: calc(100% - 32px);
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      margin-top: 0;
      margin-bottom: 0.3em;
      color: #ffe3f7;
      text-shadow:
        0 0 6px #fff,
        0 0 14px var(--neon-pink),
        0 0 30px var(--neon-pink),
        0 0 50px var(--neon-cyan);
    }

    .tagline {
      font-size: 0.9em;
      margin-bottom: 35px;
      color: var(--neon-yellow);
      text-shadow: 0 0 8px var(--neon-yellow);
      letter-spacing: 0.1em;
    }

    .question {
      margin-bottom: 25px;
      padding: 22px;
      background: rgba(8, 8, 32, 0.45);
      border-radius: 18px;
      border: 1.5px solid var(--neon-cyan);
      border-left: 6px solid var(--neon-pink);
      text-align: left;
      box-shadow:
        0 0 12px rgba(77, 225, 255, 0.3),
        inset 0 0 15px rgba(182, 140, 255, 0.15);
      backdrop-filter: blur(2px);
    }

    .question p {
      margin-top: 0;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 8px var(--neon-pink);
      font-size: 1.05em;
    }

    label {
      display: block;
      margin: 10px 0;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 10px;
      color: #d8c8ff;
      transition: all 0.2s ease;
    }

    label:hover {
      background: rgba(255, 122, 217, 0.22);
      color: #fff;
      text-shadow: 0 0 8px var(--neon-pink);
      transform: translateX(6px);
    }

    input[type="radio"] {
      margin-right: 10px;
      accent-color: var(--neon-pink);
      transform: scale(1.2);
    }

    .submit-btn {
      display: block;
      margin: 2rem auto 0;
      padding: 1rem 2.5rem;
      background: rgba(8, 8, 32, 0.75);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      border: 2px solid var(--neon-purple);
      border-radius: 50px;
      cursor: pointer;
      text-shadow: 0 0 8px var(--neon-purple);
      box-shadow:
        0 0 12px rgba(182, 140, 255, 0.6),
        inset 0 0 10px rgba(182, 140, 255, 0.3);
      transition:
        transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275),
        box-shadow 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
      font-family: inherit;
    }

    .submit-btn:hover {
      color: #070720;
      background: var(--neon-purple);
      transform: translateY(-4px) scale(1.04);
      box-shadow:
        0 0 20px var(--neon-purple),
        0 0 38px var(--neon-purple);
      text-shadow: none;
    }

    .shard {
      position: fixed;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid var(--neon-purple);
      pointer-events: none;
      z-index: 9999;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
    }

    .star {
      position: absolute;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>

<body>

<div id="background-image"></div>

<div id="background-wrap">
  <canvas id="spores"></canvas>
  <div id="mycelium"></div>
</div>

<div class="outer-container">
  <h1>🪐 御霊を整えましょう🪐</h1>

  <div class="tagline">
    〜 あなたは「めじぃ（飯）❗️」に辿り着けるか 〜
  </div>

  <form id="soulForm">
    <div class="question">
      <p>Q1. 世界がもし441930秒で終わるなら、何をする？</p>

      <label>
        <input type="radio" name="q1" value="a">
        ベコ飼うだ 🐄
      </label>

      <label>
        <input type="radio" name="q1" value="b">
        踊る 💃
      </label>

      <label>
        <input type="radio" name="q1" value="c">
        ﾚｰｻﾞｰﾃﾞｨｽｸは何者だ( 👁️ 👄 👁️ )⁉️
      </label>
    </div>

    <div class="question">
      <p>Q2. 朝目覚めたら別の惑星にいた。どうする？</p>

      <label>
        <input type="radio" name="q2" value="a">
        さいなら 🚀
      </label>

      <label>
        <input type="radio" name="q2" value="b">
        ワロス 🧘
      </label>

      <label>
        <input type="radio" name="q2" value="c">
        寝ます 💤
      </label>
    </div>

    <button
      type="button"
      class="submit-btn"
      onclick="checkAnswers()"
    >
      ✨御霊を拝見致しました( ´ᯅ` )✨
    </button>
  </form>
</div>

<script>
const NEON_COLORS = [
  '#ff7ad9',
  '#4de1ff',
  '#ffe84a',
  '#b68cff'
];

const canvas = document.getElementById("spores");
const ctx = canvas.getContext("2d");
const bgWrap = document.getElementById("background-wrap");

let w, h, spores = [];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;

  spores = Array.from({ length: 150 }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 2,
    o: Math.random(),
    s: Math.random() * 0.5 + 0.2,
    z: Math.random() * 2
  }));
}

function draw() {
  ctx.clearRect(0, 0, w, h);

  spores.forEach(s => {
    s.x += Math.sin(Date.now() * 0.0001 + s.y) * 0.1 * s.z;
    s.y += Math.cos(Date.now() * 0.00005 + s.x) * 0.1 * s.z;

    if (s.x < 0) s.x = w;
    if (s.x > w) s.x = 0;
    if (s.y < 0) s.y = h;
    if (s.y > h) s.y = 0;

    s.o += (Math.random() - 0.5) * 0.05;
    s.o = Math.max(0.1, Math.min(1, s.o));

    const idx = Math.min(
      NEON_COLORS.length - 1,
      Math.floor((s.x / w) * NEON_COLORS.length)
    );

    const alpha = Math.floor(s.o * 255)
      .toString(16)
      .padStart(2, '0');

    ctx.beginPath();
    ctx.fillStyle = `${NEON_COLORS[idx]}${alpha}`;
    ctx.arc(s.x, s.y, s.r * s.z, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);
resize();
draw();

document.addEventListener("mousemove", (e) => {
  const moveX =
    (e.clientX / window.innerWidth - 0.5) * 30;

  const moveY =
    (e.clientY / window.innerHeight - 0.5) * 30;

  bgWrap.style.transform =
    `translate(${-moveX}px,${-moveY}px)`;
});

document.addEventListener('click', (e) => {
  const shardCount = 12;

  for (let i = 0; i < shardCount; i++) {
    const shard = document.createElement('div');
    shard.className = 'shard';

    const color =
      NEON_COLORS[
        Math.floor(Math.random() * NEON_COLORS.length)
      ];

    const size = Math.random() * 12 + 4;

    shard.style.borderBottom =
      `${size * 2}px solid${color}`;

    shard.style.borderLeftWidth = `${size}px`;
    shard.style.borderRightWidth = `${size}px`;

    shard.style.left = e.clientX + 'px';
    shard.style.top = e.clientY + 'px';

    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 120 + 40;

    const tx = Math.cos(angle) * velocity;
    const ty = Math.sin(angle) * velocity;
    const rot = Math.random() * 360;

    document.body.appendChild(shard);

    const anim = shard.animate(
      [
        {
          transform:
            'translate(-50%, -50%) rotate(0deg) scale(1)',
          opacity: 1
        },
        {
          transform:
            `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(0)`,
          opacity: 0
        }
      ],
      {
        duration: 600,
        easing: 'ease-out'
      }
    );

    anim.onfinish = () => shard.remove();
  }
});

window.addEventListener("DOMContentLoaded", () => {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const targets = document.querySelectorAll("h1, .submit-btn");
  const marks = ["✦", "✧", "✨"];

  function sparkle(element) {
    const rect = element.getBoundingClientRect();
    const spark = document.createElement("span");

    spark.textContent = marks[Math.floor(Math.random() * marks.length)];

    const sparkLeft = rect.left + window.scrollX + Math.random() * rect.width;
    const sparkTop = rect.top + window.scrollY + Math.random() * rect.height;

    Object.assign(spark.style, {
      position: "absolute",
      left: sparkLeft + "px",
      top: sparkTop + "px",
      zIndex: "9999",
      pointerEvents: "none",
      color: NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)],
      fontSize: (9 + Math.random() * 10) + "px",
      textShadow: "0 0 8px currentColor",
      opacity: "1",
      transition: "transform 750ms ease-out, opacity 750ms ease-out"
    });

    document.body.appendChild(spark);

    requestAnimationFrame(() => {
      const dx = (Math.random() - 0.5) * 44;
      const dy = -(18 + Math.random() * 32);
      const rot = (Math.random() - 0.5) * 180;
      spark.style.transform =
        `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.4)`;
      spark.style.opacity = "0";
    });

    window.setTimeout(() => spark.remove(), 800);
  }

  targets.forEach((element) => {
    let timer = null;

    element.addEventListener("mouseenter", () => {
      if (timer) return;
      sparkle(element);
      timer = window.setInterval(() => sparkle(element), 90);
    });

    element.addEventListener("mouseleave", () => {
      if (timer) {
        window.clearInterval(timer);
        timer = null;
      }
    });
  });
});

const correctAnswers = {
  q1: 'c',
  q2: 'b'
};

function checkAnswers() {
  let score = 0;

  for (let key in correctAnswers) {
    const selected = document.querySelector(
      `input[name="${key}"]:checked`
    );

    if (selected && selected.value === correctAnswers[key]) {
      score++;
    }
  }

  if (score === Object.keys(correctAnswers).length) {
    alert("おめでとう（ 👁️_ゝ👁️）✨");
    window.location.href = "morires.html";
  } else {
    alert("ぶぶ漬け食べなはれや( ´ᯅ` )");
    window.location.href = "index.html";
  }
}

for (let i = 0; i < 222; i++) {
  const star = document.createElement("div");
  star.classList.add("star");

  const color =
    NEON_COLORS[
      Math.floor(Math.random() * NEON_COLORS.length)
    ];

  star.style.background = color;
  star.style.boxShadow = `0 0 6px ${color}`;
  star.style.width = star.style.height =
    Math.random() * 2 + "px";

  star.style.left = Math.random() * 222 + "%";
  star.style.top = Math.random() * 222 + "%";

  bgWrap.appendChild(star);
}
</script>

</body>
</html>
